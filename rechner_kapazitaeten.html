<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="description" content="Kapazitätsrechner für BMA-Akkus" />
  <meta charset="utf-8">
  <title>Kapazitätsrechner für BMA-Akkus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="OJ">
	<!-- Latest compiled and minified CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Latest compiled JavaScript -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script> 
</head>

<body data-bs-theme="dark">
<h1 class="text-center mb-5">Kapazitätsrechner für BMA-Akkus</h2>
<div class="container">
<form class="was-validated">
 <div class="input-group mb-3">
	<div class="input-group-prepend w-50">
		<span class="input-group-text">Alarmzeit</span>
	  </div>
    <input type="number" pattern="^\d*" inputmode="decimal" placeholder="Zeit eintragen" class="form-control" id="h_alarm" name="h_alarm" step=".01" required onchange="calculateCapacity(this);">
	<div class="input-group-append" style="width: 50px">
		<span class="input-group-text">h</span>
	  </div>
  </div>
  <div class="input-group mb-3">
	<div class="input-group-prepend w-50">
		<span class="input-group-text">Ruhezeit</span>
	  </div>
    <input type="number" pattern="^\d*" inputmode="decimal" placeholder="Zeit eintragen" class="form-control" id="h_ruhe" name="h_ruhe" step=".01" required onchange="calculateCapacity(this);">
	<div class="input-group-append" style="width: 50px">
		<span class="input-group-text">h</span>
	  </div>
  </div>
  <div class="input-group mb-3">
	<div class="input-group-prepend w-50">
		<span class="input-group-text">Alarmstrom</span>
	  </div>
    <input type="number" pattern="^\d*" inputmode="decimal" placeholder="Strom eintragen" class="form-control" id="i_alarm" name="i_alarm" step=".01" required onchange="calculateCapacity(this);">
	<div class="input-group-append" style="width: 50px">
		<span class="input-group-text">mA</span>
	  </div>
  </div>
  
  <div class="input-group mb-3">
	<div class="input-group-prepend w-50">
		<span class="input-group-text">Ruhestrom</span>
	  </div>
    <input type="number" pattern="^\d*" inputmode="decimal" placeholder="Strom eintragen" class="form-control" id="i_ruhe" name="i_ruhe" step=".01" required onchange="calculateCapacity(this);">
	<div class="input-group-append" style="width: 50px">
		<span class="input-group-text">mA</span>
	  </div>
  </div>
  <div class="input-group mb-3">
	<div class="input-group-prepend w-50">
		<span class="input-group-text">Kapazität</span>
	  </div>
    <input type="number" pattern="^\d*" inputmode="decimal" placeholder="Kapazität eintragen" class="form-control" id="kapazitaet" name="kapazitaet" step=".01" required onchange="calculateCapacity(this);">
	<div class="input-group-append" style="width: 50px">
		<span class="input-group-text">Ah</span>
	  </div>
  </div>
<div class="input-group mb-5">
	<div class="input-group-prepend w-50">
		<span class="input-group-text text-secondary">Sicherheitsfaktor</span>
	  </div>
    <input type="number" pattern="^\d*" inputmode="decimal" placeholder="Faktor eintragen" class="form-control text-secondary" id="sf" name="sf" step=".01" value="1.25" required onchange="calculateCapacity(this);">
  </div>
  <div class="d-grid gap-2">
	  <button class="btn btn-primary" type="button" id="btn_reset" onclick="resetValues();">Zurücksetzen</button>
	</div>
</form> 
</div>

<script>

function resetValues(){
	document.getElementById("h_alarm").value = "";
	document.getElementById("h_ruhe").value = "";
	document.getElementById("i_alarm").value = "";
	document.getElementById("i_ruhe").value = "";
	document.getElementById("kapazitaet").value = "";
	document.getElementById("sf").value = document.getElementById("sf").defaultValue;
	
	resetResultHighlighting();
}

function resetResultHighlighting(){
		document.getElementById("h_alarm").previousElementSibling.firstElementChild.classList.remove("bg-success");
		document.getElementById("h_ruhe").previousElementSibling.firstElementChild.classList.remove("bg-success");
		document.getElementById("i_alarm").previousElementSibling.firstElementChild.classList.remove("bg-success");
		document.getElementById("i_ruhe").previousElementSibling.firstElementChild.classList.remove("bg-success");
		document.getElementById("kapazitaet").previousElementSibling.firstElementChild.classList.remove("bg-success");
}

function calculateCapacity(target){
	var h_alarm,
		h_ruhe,
		i_alarm,
		i_ruhe,
		kapazitaet,
		sf;
		
		h_alarm = document.getElementById("h_alarm");
		h_ruhe = document.getElementById("h_ruhe");
		i_alarm = document.getElementById("i_alarm");
		i_ruhe = document.getElementById("i_ruhe");
		kapazitaet = document.getElementById("kapazitaet");
		sf = document.getElementById("sf");
		
		
		resetResultHighlighting();
		
		/* Sicherheitsfaktor und letzter Eingabewert sind Grundbedingung */	
		if(isValidNumber(sf) && isValidNumber(target)){
			switch(target){
				case h_alarm:
					if(!isValidNumber(h_ruhe)){
						h_ruhe.value = (berechneHRuhe(i_ruhe, i_alarm, h_alarm, kapazitaet, sf)).toFixed(2);
						highlightSuccess(h_ruhe);
					}else if(!isValidNumber(i_alarm)){
						i_alarm.value = (berechneIAlarm(h_ruhe, i_ruhe, h_alarm, kapazitaet, sf)).toFixed(2);
						highlightSuccess(i_alarm);
					}else if(!isValidNumber(i_ruhe)){			
						i_ruhe.value = (berechneIRuhe(h_ruhe, i_alarm, h_alarm, kapazitaet, sf)).toFixed(2);
						highlightSuccess(i_ruhe);
					}else{ 
						kapazitaet.value = (berechneKapazitaet(h_ruhe, i_ruhe, i_alarm, h_alarm, sf)).toFixed(2);
						highlightSuccess(kapazitaet);
					}
					break;
				case h_ruhe:
					if(!isValidNumber(h_alarm)){
						h_alarm.value = (berechneHAlarm(h_ruhe, i_ruhe, i_alarm, kapazitaet, sf)).toFixed(2);
						highlightSuccess(h_alarm);
					}else if(!isValidNumber(i_alarm)){
						i_alarm.value = (berechneIAlarm(h_ruhe, i_ruhe, h_alarm, kapazitaet, sf)).toFixed(2);
						highlightSuccess(i_alarm);					
					}else if(!isValidNumber(i_ruhe)){
						i_ruhe.value = (berechneIRuhe(h_ruhe, i_alarm, h_alarm, kapazitaet, sf)).toFixed(2);
						highlightSuccess(i_ruhe);					
					}else{
						/* Wenn alle Werte valide, rechne immer Kapazität aus */
						kapazitaet.value = (berechneKapazitaet(h_ruhe, i_ruhe, i_alarm, h_alarm, sf)).toFixed(2);
						highlightSuccess(kapazitaet);
					}
					break;
				case i_alarm:
					if(!isValidNumber(h_ruhe)){
						h_ruhe.value = (berechneHRuhe(i_ruhe, i_alarm, h_alarm, kapazitaet, sf)).toFixed(2);
						highlightSuccess(h_ruhe);
					}else if(!isValidNumber(h_alarm)){
						h_alarm.value = (berechneHAlarm(h_ruhe, i_ruhe, i_alarm, kapazitaet, sf)).toFixed(2);
						highlightSuccess(h_alarm);					
					}else if(!isValidNumber(i_ruhe)){
						i_ruhe.value = (berechneIRuhe(h_ruhe, i_alarm, h_alarm, kapazitaet, sf)).toFixed(2);
						highlightSuccess(i_ruhe);					
					}else{
						/* Wenn alle Werte valide, rechne immer Kapazität aus */
						kapazitaet.value = (berechneKapazitaet(h_ruhe, i_ruhe, i_alarm, h_alarm, sf)).toFixed(2);
						highlightSuccess(kapazitaet);
					}
					break;
				case i_ruhe:
					if(!isValidNumber(h_ruhe)){
						h_ruhe.value = (berechneHRuhe(i_ruhe, i_alarm, h_alarm, kapazitaet, sf)).toFixed(2);
						highlightSuccess(h_ruhe);					
					}else if(!isValidNumber(h_alarm)){
						h_alarm.value = (berechneHAlarm(h_ruhe, i_ruhe, i_alarm, kapazitaet, sf)).toFixed(2);
						highlightSuccess(h_alarm);					
					}else if(!isValidNumber(i_alarm)){
						i_alarm.value = (berechneIAlarm(h_ruhe, i_ruhe, h_alarm, kapazitaet, sf)).toFixed(2);
						highlightSuccess(i_alarm);					
					}else{
						/* Wenn alle Werte valide, rechne immer Kapazität aus */
						kapazitaet.value = (berechneKapazitaet(h_ruhe, i_ruhe, i_alarm, h_alarm, sf)).toFixed(2);
						highlightSuccess(kapazitaet);
					}
					break;
				case kapazitaet:
					if(!isValidNumber(h_alarm)){
						h_alarm.value = (berechneHAlarm(h_ruhe, i_ruhe, i_alarm, kapazitaet, sf)).toFixed(2);
						highlightSuccess(h_alarm);					
					}else if(!isValidNumber(i_alarm)){
						i_alarm.value = (berechneIAlarm(h_ruhe, i_ruhe, h_alarm, kapazitaet, sf)).toFixed(2);
						highlightSuccess(i_alarm);					
					}else if(!isValidNumber(i_ruhe)){
						i_ruhe.value = (berechneIRuhe(h_ruhe, i_alarm, h_alarm, kapazitaet, sf)).toFixed(2);
						highlightSuccess(i_ruhe);					
					}else{
						/* Wenn alle Werte inkl. Kapazitaet valide, rechne Ruhezeit aus aus */
						h_ruhe.value = (berechneHRuhe(i_ruhe, i_alarm, h_alarm, kapazitaet, sf)).toFixed(2);
						highlightSuccess(h_ruhe);	
					}
					break;
				/* Sonderfall SF als obligatorische Groesse */
				case sf:
					if(!isValidNumber(h_ruhe)){
						h_ruhe.value = (berechneHRuhe(i_ruhe, i_alarm, h_alarm, kapazitaet, sf)).toFixed(2);
						highlightSuccess(h_ruhe);					
					}else if(!isValidNumber(h_alarm)){
						h_alarm.value = (berechneHAlarm(h_ruhe, i_ruhe, i_alarm, kapazitaet, sf)).toFixed(2);
						highlightSuccess(h_alarm);					
					}else if(!isValidNumber(i_alarm)){
						i_alarm.value = (berechneIAlarm(h_ruhe, i_ruhe, h_alarm, kapazitaet, sf)).toFixed(2);
						highlightSuccess(i_alarm);					
					}else if(!isValidNumber(i_ruhe)){
						i_ruhe.value = (berechneIRuhe(h_ruhe, i_alarm, h_alarm, kapazitaet, sf)).toFixed(2);
						highlightSuccess(i_ruhe);					
					}else{
						/* Wenn alle Werte valide, rechne immer Kapazität aus */
						kapazitaet.value = (berechneKapazitaet(h_ruhe, i_ruhe, i_alarm, h_alarm, sf)).toFixed(2);
						highlightSuccess(kapazitaet);
					}
					break;		
				default:
					/* Keine Berechnung */
					break;
			
			}
	
		
		
		}
}


function berechneHAlarm(h_ruhe, i_ruhe, i_alarm, kapazitaet, sf){
		return ((getNumber(kapazitaet) / getNumber(sf)) - ((getNumber(i_ruhe) / 1000 ) * getNumber(h_ruhe))) /  (getNumber(i_alarm) / 1000 );
}

function berechneIRuhe(h_ruhe, i_alarm, h_alarm, kapazitaet, sf){
	return ( (getNumber(kapazitaet) / getNumber(sf)) - ( (getNumber(i_alarm) / 1000 ) * getNumber(h_alarm) ) ) / getNumber(h_ruhe) * 1000;
}

function berechneIAlarm(h_ruhe, i_ruhe, h_alarm, kapazitaet, sf){
	return (( getNumber(kapazitaet) / getNumber(sf) ) - (getNumber(h_ruhe) * (getNumber(i_ruhe) / 1000 ))) / getNumber(h_alarm) *1000;
}

function berechneHRuhe(i_ruhe, i_alarm, h_alarm, kapazitaet, sf){
	return ( (getNumber(kapazitaet) / getNumber(sf)) - ( (getNumber(i_alarm) / 1000 ) * getNumber(h_alarm) ) ) / (getNumber(i_ruhe) / 1000 );
}

function berechneKapazitaet(h_ruhe, i_ruhe, i_alarm, h_alarm, sf){
	return ((getNumber(h_ruhe) * (getNumber(i_ruhe) / 1000 )) + ((getNumber(i_alarm) / 1000 ) * getNumber(h_alarm)) ) * getNumber(sf);
}

function getNumber(el){
	return parseFloat(el.value);
}

function isValidNumber(el){
	return !isNaN(getNumber(el));
}



function highlightSuccess(el){
	if(isValidNumber(el))
		el.previousElementSibling.firstElementChild.classList.add("bg-success");
}


</script>

</body>
</html>
